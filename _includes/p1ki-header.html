<header class="site-header" data-site-header>
  <div class="header-inner">
    <a class="brand pixel-font" href="{{ '/' | relative_url }}" aria-label="p1ki 홈">p1ki</a>
    <button class="menu-toggle pixel-font" type="button" aria-expanded="false" aria-controls="site-nav" data-menu-toggle>MENU</button>
    <nav id="site-nav" class="site-nav" aria-label="주요 메뉴" data-site-nav>
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active" aria-current="page"{% endif %}>HOME</a>
      <a href="{{ '/categories/' | relative_url }}"{% if page.url contains '/categories' %} class="active" aria-current="page"{% endif %}>CATEGORIES</a>
      <a href="{{ '/tags/' | relative_url }}"{% if page.url contains '/tags' %} class="active" aria-current="page"{% endif %}>TAGS</a>
      <a href="{{ '/archives/' | relative_url }}"{% if page.url contains '/archives' or page.layout == 'post' %} class="active" aria-current="page"{% endif %}>ARCHIVES</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} class="active" aria-current="page"{% endif %}>ABOUT</a>
    </nav>
  </div>
</header>
