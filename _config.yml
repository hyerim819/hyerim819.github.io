plugins:
  - jekyll-archives
  - jekyll-seo-tag
  - jekyll-sitemap

lang: ko
timezone: Asia/Seoul

title: p1ki
tagline: 열정 원툴의 기록지
description: 공부하고 활동한 내용을 정리하며 학습과 성장 과정을 기록하는 p1ki의 블로그입니다.
url: "https://p1ki-lab.github.io"
baseurl: ""

github:
  username: p1ki-lab

social:
  name: p1ki
  email:
  links:
    - https://github.com/p1ki-lab

webmaster_verifications:
  google:
  bing:

analytics:
  google:
    id:

pageviews:
  provider:

comments:
  provider:

pwa:
  enabled: false
  cache:
    enabled: false

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
