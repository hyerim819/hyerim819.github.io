layout: default

<div class="page-shell"><span class="page-kicker">POSTS / HISTORY</span><h1 class="page-title">ARCHIVE</h1><p class="page-description">작성한 기록을 시간순으로 모았습니다.</p>
  <section class="archive-list">{% for post in site.posts %}<a class="archive-item" href="{{ post.url | relative_url }}"><time>{{ post.date | date: '%Y.%m.%d' }}</time><h2>{{ post.title }}</h2><span class="arrow">→</span></a>{% endfor %}</section>
</div>
