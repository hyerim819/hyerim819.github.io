<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'ko' }}">
  {% include p1ki-head.html %}
  <body class="layout-{{ page.layout | default: 'default' }}">
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
    {% unless page.layout == 'home' %}{% include p1ki-header.html %}{% endunless %}
    <main id="main-content" class="site-main">
      {{ content }}
    </main>
    {% unless page.layout == 'home' %}{% include p1ki-footer.html %}{% endunless %}
    <script src="{{ '/assets/js/p1ki.js' | relative_url }}" defer></script>
  </body>
</html>
