---
layout: default
---
<div class="page-shell"><span class="page-kicker">TAG / {{ page.posts | size }} POSTS</span><h1 class="page-title">{{ page.title }}</h1>
  <section class="archive-list">{% for post in page.posts %}<a class="archive-item" href="{{ post.url | relative_url }}"><time>{{ post.date | date: '%Y.%m.%d' }}</time><h2>{{ post.title }}</h2><span class="arrow">→</span></a>{% endfor %}</section>
</div>
